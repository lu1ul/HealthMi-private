name: Diagnose simulator startup

on:
  workflow_dispatch:
    inputs:
      simulator_runtime:
        description: 'Simulator OS for startup diagnostics'
        required: true
        type: choice
        options:
          - ios-16.4
          - runner-default
        default: ios-16.4

permissions:
  contents: read

jobs:
  simulator-startup:
    name: Build, install, and launch in iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode and install requested simulator runtime
        id: runtime
        env:
          SIMULATOR_RUNTIME: ${{ inputs.simulator_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$GITHUB_WORKSPACE/build/simulator-diagnostics"
          mkdir -p "$diagnostic_dir/crash-reports"

          runtime_id=""
          if [[ "$SIMULATOR_RUNTIME" == "ios-16.4" ]]; then
            xcode_path="/Applications/Xcode_16.4.app/Contents/Developer"
            if [[ ! -d "$xcode_path" ]]; then
              echo "::error::Xcode 16.4 is not installed on this runner."
              exit 1
            fi
            sudo xcode-select -s "$xcode_path"
            runtime_id="com.apple.CoreSimulator.SimRuntime.iOS-16-4"
            xcodebuild -version 2>&1 | tee "$diagnostic_dir/xcode-version.txt"
            if ! xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 \
              | tee "$diagnostic_dir/runtime-download.log"; then
              xcrun simctl list runtimes available 2>&1 \
                | tee "$diagnostic_dir/available-runtimes.txt"
              exit 1
            fi
          elif [[ "$SIMULATOR_RUNTIME" == "runner-default" ]]; then
            xcodebuild -version 2>&1 | tee "$diagnostic_dir/xcode-version.txt"
          else
            echo "::error::Unsupported simulator runtime input: $SIMULATOR_RUNTIME"
            exit 1
          fi

          xcrun simctl list runtimes available 2>&1 \
            | tee "$diagnostic_dir/available-runtimes.txt"
          xcrun simctl list devices available 2>&1 \
            | tee "$diagnostic_dir/available-devices.txt"
          echo "runtime_id=$runtime_id" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        env:
          SIMULATOR_RUNTIME_ID: ${{ steps.runtime.outputs.runtime_id }}
        shell: bash
        run: |
          set -euo pipefail
          simulator_json="$(xcrun simctl list devices available -j)"
          selection="$(python3 -c '
          import json, sys
          requested_runtime = sys.argv[1]
          devices_by_runtime = json.load(sys.stdin)["devices"]
          devices = [
              device
              for runtime_id, runtime_devices in devices_by_runtime.items()
              for device in runtime_devices
              if device.get("isAvailable")
              and device["name"].startswith("iPhone")
              and (not requested_runtime or runtime_id == requested_runtime)
              and (not requested_runtime or device["name"] == "iPhone 14")
          ]
          if not devices:
              if requested_runtime:
                  raise SystemExit(f"No iPhone 14 simulator is available for runtime {requested_runtime}")
              raise SystemExit("No available iPhone simulator was found")
          devices.sort(key=lambda device: ("Pro" not in device["name"], device["name"]))
          device = devices[0]
          for runtime_id, runtime_devices in devices_by_runtime.items():
              if any(candidate["udid"] == device["udid"] for candidate in runtime_devices):
                  print("\t".join((device["udid"], device["name"], runtime_id)))
                  break
          ' "$SIMULATOR_RUNTIME_ID" <<< "$simulator_json")"
          IFS=$'\t' read -r simulator_udid simulator_name simulator_runtime_id <<< "$selection"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          echo "runtime_id=$simulator_runtime_id" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $simulator_name ($simulator_udid), runtime $simulator_runtime_id"

      - name: Build simulator app
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p build/simulator-diagnostics
          set +e
          xcodebuild \
            -project HealthMi.xcodeproj \
            -scheme HealthMi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/simulator-diagnostics/build.log
          build_status=${PIPESTATUS[0]}
          set -e
          exit "$build_status"

      - name: Install, launch, and collect diagnostics
        id: diagnose
        continue-on-error: true
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME_ID: ${{ steps.simulator.outputs.runtime_id }}
        run: |
          set -euo pipefail
          diagnostic_dir="$GITHUB_WORKSPACE/build/simulator-diagnostics"
          app_path="$GITHUB_WORKSPACE/build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/HealthMi.app"
          mkdir -p "$diagnostic_dir/crash-reports"
          test -d "$app_path"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app_path/Info.plist")"

          printf 'simulator=%s\nudid=%s\nruntime_id=%s\nbundle_id=%s\n' \
            "$SIMULATOR_NAME" "$SIMULATOR_UDID" "$SIMULATOR_RUNTIME_ID" "$bundle_id" \
            > "$diagnostic_dir/metadata.txt"

          xcrun simctl boot "$SIMULATOR_UDID" 2>&1 | tee "$diagnostic_dir/boot.txt" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b \
            2>&1 | tee "$diagnostic_dir/bootstatus.txt"

          set +e
          xcrun simctl install "$SIMULATOR_UDID" "$app_path" \
            2>&1 | tee "$diagnostic_dir/install.txt"
          install_status=${PIPESTATUS[0]}
          set -e
          echo "install_exit_code=$install_status" >> "$diagnostic_dir/metadata.txt"

          launch_status="$install_status"
          if [ "$install_status" -eq 0 ]; then
            set +e
            xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" "$bundle_id" \
              2>&1 | tee "$diagnostic_dir/launch.txt"
            launch_status=${PIPESTATUS[0]}
            set -e
          else
            echo 'Launch skipped because simulator install failed.' \
              | tee "$diagnostic_dir/launch.txt"
          fi
          echo "launch_exit_code=$launch_status" >> "$diagnostic_dir/metadata.txt"

          sleep 20
          xcrun simctl spawn "$SIMULATOR_UDID" /bin/ps -A -o pid,comm,args \
            > "$diagnostic_dir/processes.txt" 2>&1 || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 5m --style compact \
            --predicate 'process == "HealthMi" OR (process == "SpringBoard" AND eventMessage CONTAINS[c] "HealthMi")' \
            > "$diagnostic_dir/unified-log.txt" 2>&1 || true
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$diagnostic_dir/simulator-screen.png" \
            > "$diagnostic_dir/screenshot.txt" 2>&1 || true

          host_crash_dir="$HOME/Library/Logs/DiagnosticReports"
          simulator_crash_dir="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter"
          for crash_dir in "$host_crash_dir" "$simulator_crash_dir"; do
            if [ -d "$crash_dir" ]; then
              find "$crash_dir" -maxdepth 2 -type f -iname '*HealthMi*' -mmin -15 \
                -exec cp -p {} "$diagnostic_dir/crash-reports/" \; 2>/dev/null || true
            fi
          done

          if grep -Fq "$bundle_id" "$diagnostic_dir/processes.txt" \
            || grep -Fq 'HealthMi' "$diagnostic_dir/processes.txt"; then
            echo 'app_process_after_20_seconds=present' >> "$diagnostic_dir/metadata.txt"
          else
            echo 'app_process_after_20_seconds=not_found' >> "$diagnostic_dir/metadata.txt"
            if [ "$launch_status" -eq 0 ]; then
              launch_status=1
              echo 'The app process was not present after the launch wait.' \
                | tee -a "$diagnostic_dir/launch.txt"
            fi
          fi

          exit "$launch_status"

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HealthMi-simulator-diagnostics
          path: build/simulator-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Report simulator launch result
        if: steps.diagnose.outcome == 'failure'
        run: |
          echo "::error::HealthMi failed to launch or remain running in the iOS Simulator. Download the HealthMi-simulator-diagnostics artifact."
          exit 1
